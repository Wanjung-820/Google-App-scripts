<title>Money Tracker</title>
<style>
  :root{--paper:#EDECE4;--surface:#FBFAF5;--ink:#123A34;--inkSoft:#1C4A42;--text:#182320;
    --muted:#6C776F;--faint:#98A19A;--jade:#2F7D6B;--clay:#B0603A;--gold:#B5842B;--line:#DEDCD1;--lockbg:#E7E9E2;--blue:#3B5BA5}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--paper);color:var(--text);
    font-family:"SF Pro Display","PingFang TC","Noto Sans TC",system-ui,-apple-system,sans-serif}
  body{min-height:100vh;min-height:100dvh}
  .tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  .press:active{transform:scale(.97)}
  .wrap{max-width:460px;margin:0 auto;padding:20px 14px 108px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
  .hero{border-radius:22px;padding:22px 20px 18px;color:#fff;box-shadow:0 10px 30px rgba(18,58,52,.18)}
  .big{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
  .nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:40}
  .navin{max-width:460px;width:100%;display:flex;padding:8px 0 max(20px,env(safe-area-inset-bottom))}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10.5px}
  .navbtn.on{color:var(--ink);font-weight:700}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .sheet-bg{position:fixed;inset:0;background:rgba(20,30,26,.4);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--paper);width:100%;max-width:460px;border-radius:24px 24px 0 0;
    padding:10px 18px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.2);max-height:88vh;overflow-y:auto}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
  .lbl{margin-top:20px;margin-bottom:8px;font-size:13px;color:var(--muted);font-weight:600}
  .foot{margin-top:24px;font-size:11px;color:var(--faint);text-align:center;line-height:1.5}
  .qbtn{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .in{width:100%;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);outline:none;background:var(--surface)}
  .btn{width:100%;border-radius:14px;padding:15px 0;font-size:16px;font-weight:700}
  .fadein{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  svg{display:block}
</style>

<div id="root"><div style="max-width:460px;margin:0 auto;padding:60px 24px;text-align:center;color:#6C776F;line-height:1.7">
  <div style="font-size:20px;font-weight:700;color:#123A34;margin-bottom:12px">Money Tracker</div>
  如果你「只看到這幾行字」,代表你是用 iPhone 的<b>檔案預覽</b>打開的,預覽不會執行程式。<br><br>
  請改用<b>瀏覽器</b>打開這個檔案(見下方說明),就會出現完整畫面。
</div></div>
<script>
"use strict";
var C={paper:"#EDECE4",surface:"#FBFAF5",ink:"#123A34",inkSoft:"#1C4A42",text:"#182320",
 muted:"#6C776F",faint:"#98A19A",jade:"#2F7D6B",clay:"#B0603A",gold:"#B5842B",line:"#DEDCD1",lockbg:"#E7E9E2",blue:"#3B5BA5"};
var KEY="qbht-data-v3", PWKEY="qbht-pw-v1";
function nt(n){return "$"+Math.round(n).toLocaleString("en-US");}
function uid(){return Date.now()+Math.floor(Math.random()*1000);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* 這個檔案不含任何個人財務數字。所有金額都由你在 App 裡自己填,只存在這台裝置的 localStorage。 */
var DEFAULTS={
 settings:{configured:false,income:0,rent:0,filial:0,savingsFixed:0,invest:0,travelFundMonthly:0,domesticReserve:0,cycleStartDay:1},
 assets:{savingsAccum:0,stockValue:0,stockCost:0,travelFund:0,cash:0,example:true},
 expenses:[], play:false,
 cards:[],        /* {id,name,color,closeDay,payDay} */
 installments:[], /* {id,name,amt,startYM,count,card} */
 plans:[],        /* {id,ym,name,amount,card} amount 為負代表進帳 */
 dividends:[],    /* {id,name,ym,amount,yearly} 股息:入帳的那個月 */
 holdings:[],     /* {id,name,type,shares,avgCost,price} 個股/ETF 持股明細 */
 netWorthHistory:[], /* {date,total} 每次校正資產/存持股時留下的真實快照,不是外推 */
 goals:[{id:uid(),name:"存到 100 萬",target:1000000,tasks:[
   {id:uid(),name:"第一桶 50 萬",target:500000},
   {id:uid(),name:"衝到 70 萬",target:700000},
   {id:uid(),name:"逼近 90 萬",target:900000},
   {id:uid(),name:"達標 100 萬",target:1000000}]}]
};
var CARD_COLORS=[C.blue,C.jade,C.clay,C.gold,C.inkSoft];
var HOLDING_TYPES=["大盤型ETF","高股息ETF","主題型ETF","個股","債券","海外資產","其他"];
/* 固定依「類型」本身配色,不依出現順序,顏色驗證過對本頁底色(#FBFAF5)可通過 CVD 分辨度 */
var TYPE_COLORS={"大盤型ETF":"#2a78d6","高股息ETF":"#eb6834","主題型ETF":"#1baf7a","個股":"#eda100","債券":"#e87ba4","海外資產":"#008300","其他":"#4a3aa7"};

function nextMonth(ym){var p=ym.split("-"),y=+p[0],m=+p[1];m++;if(m>12){m=1;y++;}return y+"-"+String(m).padStart(2,"0");}
function ymLabel(ym){return +ym.split("-")[1]+"月";}
function instMonths(it){var out=[],ym=it.startYM;for(var i=0;i<it.count;i++){out.push(ym);ym=nextMonth(ym);}return out;}
function activeInstall(ym){return (db.installments||[]).reduce(function(s,it){return s+(instMonths(it).indexOf(ym)>=0?it.amt:0);},0);}
function cardColor(name){var c=(db.cards||[]).filter(function(x){return x.name===name;})[0];return c?c.color:C.faint;}
function disposableMonthly(){var s=db.settings;return s.income-s.rent-s.filial-s.savingsFixed-s.invest-s.travelFundMonthly;}

/* 登記了持股明細就用明細加總,沒登記就退回校正起點填的單一數字,兩者不衝突 */
function stockTotals(){
 var hs=db.holdings||[];
 if(hs.length){
   var value=0,cost=0;
   hs.forEach(function(h){value+=(Number(h.shares)||0)*(Number(h.price)||0);cost+=(Number(h.shares)||0)*(Number(h.avgCost)||0);});
   return {value:value,cost:cost};
 }
 return {value:db.assets.stockValue||0,cost:db.assets.stockCost||0};
}
/* 每次校正資產/存持股時呼叫,留一個真實快照;同一天存多次只更新那天,不會洗版 */
function snapshotNetWorth(){
 var a=db.assets, st=stockTotals();
 var total=a.savingsAccum+st.value+a.travelFund+a.cash;
 var today=dstr(new Date());
 var hist=db.netWorthHistory=db.netWorthHistory||[];
 var last=hist[hist.length-1];
 if(last&&last.date===today)last.total=total;
 else hist.push({date:today,total:total});
 if(hist.length>60)hist.splice(0,hist.length-60);
}
function shortDate(d){var p=d.split("-");return (+p[1])+"/"+(+p[2]);}
function netWorthHistorySVG(hist){
 var W=400,H=130,padL=8,padR=8,padT=24,padB=20;
 var plotW=W-padL-padR, plotH=H-padT-padB;
 var vals=hist.map(function(h){return h.total;});
 var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
 if(min===max){min-=1;max+=1;}
 function x(i){return padL+i/(hist.length-1)*plotW;}
 function y(v){return padT+plotH-(v-min)/(max-min)*plotH;}
 var d=hist.map(function(h,i){return (i===0?"M":"L")+" "+x(i).toFixed(1)+" "+y(h.total).toFixed(1);}).join(" ");
 var last=hist[hist.length-1], first=hist[0];
 var lx=x(hist.length-1), ly=y(last.total);
 var labelY=Math.max(12,ly-10);
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
  '<path d="'+d+'" fill="none" stroke="'+C.faint+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
  '<circle cx="'+x(0).toFixed(1)+'" cy="'+y(first.total).toFixed(1)+'" r="3" fill="'+C.faint+'"/>'+
  '<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5" fill="'+C.jade+'" stroke="'+C.surface+'" stroke-width="2"/>'+
  '<text x="'+lx.toFixed(1)+'" y="'+labelY.toFixed(1)+'" text-anchor="end" font-size="13" font-weight="700" fill="'+C.text+'">'+nt(last.total)+'</text>'+
  '<text x="'+padL+'" y="'+(H-4)+'" font-size="10" fill="'+C.faint+'">'+esc(shortDate(first.date))+'</text>'+
  '<text x="'+(W-padR)+'" y="'+(H-4)+'" text-anchor="end" font-size="10" fill="'+C.faint+'">'+esc(shortDate(last.date))+'</text>'+
  '</svg>';
}
function netWorthHistoryHTML(){
 var hist=(db.netWorthHistory||[]).filter(function(h){return h&&typeof h.total==="number";});
 if(hist.length<2){
   return '<div class="lbl">淨值歷史趨勢</div><div class="card" style="padding:16px">'+
     '<div style="font-size:13px;color:'+C.muted+';line-height:1.6">目前只有'+(hist.length||"還沒有")+(hist.length?" 筆":"")+'紀錄。之後每次「校正起點」或存持股明細,這裡會累積一條真實的淨值走勢——不是公式外推,是你實際記下來的每一個點。</div></div>';
 }
 var diff=hist[hist.length-1].total-hist[0].total;
 return '<div class="lbl">淨值歷史趨勢 · 共 '+hist.length+' 筆</div><div class="card" style="padding:16px">'+
   netWorthHistorySVG(hist)+
   '<div style="font-size:12px;color:'+(diff>=0?C.jade:C.clay)+';margin-top:6px">從第一筆記錄至今 '+(diff>=0?"+":"")+nt(diff)+'</div></div>';
}

/* 股息:標的是「入帳月份」。勾了每年重複,就每年同一個月再來一次 */
function dividendsIn(ym){
 var mm=ym.split("-")[1];
 return (db.dividends||[]).filter(function(d){
   if(!d.ym)return false;
   return d.yearly?(d.ym.split("-")[1]===mm&&ym>=d.ym):d.ym===ym;
 });
}
function nextDividends(n){
 var ym=curCycle(), out=[];
 for(var i=0;i<n;i++){
   dividendsIn(ym).forEach(function(d){out.push({ym:ym,name:d.name,amount:d.amount,yearly:d.yearly});});
   ym=nextMonth(ym);
 }
 return out;
}

var CATS={"食":{label:"吃飯",color:C.ink},"雜":{label:"雜支",color:C.inkSoft},"遊":{label:"國內旅遊",color:C.gold},"現":{label:"領現金",color:C.jade}};
var ICON={
 "食":"M8 2v7M6 2v7M10 2v7a3 3 0 0 1-6 0M16 2c-1.5 0-3 2-3 6s1.5 5 3 5v9",
 "雜":"M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0",
 "遊":"M12 21s-7-5.686-7-11a7 7 0 1 1 14 0c0 5.314-7 11-7 11zM12 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2z",
 "現":"M2 7h20v10H2zM12 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0",
 "trash":"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6",
 "warn":"M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",
 "check":"M20 6 9 17l-5-5","x":"M18 6 6 18M6 6l12 12","back":"M15 18l-6-6 6-6",
 "gear":"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
};
function ic(path,color,size){size=size||22;return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+path+'"/></svg>';}

/* 時間軸不再寫死:從「當前真實月份」往後 8 個月,用你填的分期與規劃項目自動推算。 */
function buildTimeline(){
 var s=db.settings, base=disposableMonthly(), fund=db.assets.travelFund, ym=curCycle(), out=[];
 for(var i=0;i<8;i++){
  var events=[], instSum=0, endTags=[];
  (db.installments||[]).forEach(function(it){
    var ms=instMonths(it), idx=ms.indexOf(ym);
    if(idx<0)return;
    instSum+=it.amt;
    var last=idx===it.count-1;
    if(last)endTags.push(it.name+"繳完 ✓");
    events.push({t:it.name+" ("+(idx+1)+"/"+it.count+")"+(last?" 末期":""),a:it.amt,c:it.card||"—"});
  });
  fund+=s.travelFundMonthly;
  var income=0;
  (db.plans||[]).filter(function(p){return p.ym===ym;}).forEach(function(p){
    if(p.card==="基金")fund-=p.amount;
    if(p.amount<0)income+=-p.amount;
    events.push({t:p.name,a:p.amount,c:p.card||"—"});
  });
  var divSum=0;
  dividendsIn(ym).forEach(function(d){divSum+=d.amount;events.push({t:d.name+" 股息",a:-d.amount,c:"股息"});});
  income+=divSum;
  if(fund<0)fund=0;
  var daily=base-instSum;
  out.push({ym:ym,m:ymLabel(ym),range:cycleStartDay()>1?cycleLabel(ym).replace(/^\d+ 月週期/,"").replace(/[()]/g,""):"",daily:daily,fund:fund,events:events,
    danger:base>0&&daily<base*0.62&&income===0,
    dangerWhy:"分期壓在這個月、又沒有額外進帳",
    good:income>0||(endTags.length>0&&instSum>0),
    tag:endTags.length?"🎉 "+endTags.join(" · "):(income>0?"🎉 這個月有 "+nt(income)+" 進帳":"")});
  ym=nextMonth(ym);
 }
 return out;
}

var db, ui;
function normalize(d){
 d=d&&typeof d==="object"?d:{};
 var m=Object.assign({},DEFAULTS,d);
 m.settings=Object.assign({},DEFAULTS.settings,d.settings||{});
 m.assets=Object.assign({},DEFAULTS.assets,d.assets||{});
 ["expenses","cards","installments","plans","dividends","holdings","netWorthHistory","goals"].forEach(function(k){if(!Array.isArray(m[k]))m[k]=JSON.parse(JSON.stringify(DEFAULTS[k]));});
 return m;
}
function load(){try{
  var r=localStorage.getItem(KEY);
  return normalize(r?JSON.parse(r):{});
 }catch(e){return JSON.parse(JSON.stringify(DEFAULTS));}}

/* ---------- 備份 ---------- */
function backupJSON(){return JSON.stringify({app:"money-tracker",version:1,exportedAt:new Date().toISOString(),data:db},null,1);}
function backupName(){var d=new Date();return "money-tracker-"+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+".json";}
function parseBackup(txt){
 var o=JSON.parse(txt);
 var d=(o&&o.data&&typeof o.data==="object")?o.data:o;
 if(!d||typeof d!=="object"||!d.settings||typeof d.settings!=="object")throw new Error("這看起來不是 Money Tracker 的備份");
 return normalize(d);
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){ui.noStore=true;}}

function nowYM(){var n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");}

/* ---------- 薪水週期 ----------
   cycleStartDay = 1 → 就是一般日曆月。
   cycleStartDay = 25 → 8/25 ~ 9/24 這段算「9 月週期」(以結束的那個月命名)。
   下面所有 "cyc" 都是 "YYYY-MM" 字串,代表週期而不是日曆月。 */
function cycleStartDay(){var d=Math.round(Number(db.settings.cycleStartDay))||1;return d<1?1:(d>28?28:d);}
function pad2(n){return String(n).padStart(2,"0");}
function cycleFrom(y,m,day){
 var s=cycleStartDay(), ym=y+"-"+pad2(m);
 return (s>1&&day>=s)?nextMonth(ym):ym;
}
function cycleOfStr(dateStr){var p=String(dateStr).split("-");return cycleFrom(+p[0],+p[1],+p[2]);}
function curCycle(){var n=new Date();return cycleFrom(n.getFullYear(),n.getMonth()+1,n.getDate());}
function cycleRange(cyc){
 var s=cycleStartDay(), p=cyc.split("-"), y=+p[0], m=+p[1], start, end;
 if(s<=1){start=new Date(y,m-1,1);end=new Date(y,m,0);}
 else{start=new Date(y,m-2,s);end=new Date(y,m-1,s-1);}
 start.setHours(0,0,0,0);end.setHours(0,0,0,0);
 return {start:start,end:end,days:Math.round((end-start)/86400000)+1};
}
function cycleLabel(cyc){
 var s=cycleStartDay(), m=+cyc.split("-")[1];
 if(s<=1)return m+" 月";
 var r=cycleRange(cyc);
 return m+" 月週期("+(r.start.getMonth()+1)+"/"+r.start.getDate()+"–"+(r.end.getMonth()+1)+"/"+r.end.getDate()+")";
}
function shiftCycle(cyc,n){var out=cyc;for(var i=0;i<Math.abs(n);i++){out=n>0?nextMonth(out):prevMonth(out);}return out;}
function prevMonth(ym){var p=ym.split("-"),y=+p[0],m=+p[1];m--;if(m<1){m=12;y--;}return y+"-"+pad2(m);}
function dstr(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function cycleExpenses(cyc){return db.expenses.filter(function(e){return cycleOfStr(e.date)===cyc;});}

/* ---------- TODAY ---------- */
function welcomeHTML(){
 return '<div class="fadein">'+headerHTML("先花 2 分鐘,把你的數字填進來")+
  '<div class="hero" style="background:'+C.ink+'"><div style="font-size:13px;opacity:.8">歡迎</div>'+
   '<div style="font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1.3">這個 App 不知道<br>你的任何數字</div>'+
   '<div style="font-size:13px;margin-top:12px;opacity:.9;line-height:1.6">你的收入、房租、存錢、分期,全部只存在這台手機裡,不會上傳到任何地方。填一次就好,之後隨時能改。</div></div>'+
  '<button class="press btn" data-act="setup" style="margin-top:14px;background:'+C.jade+';color:#fff">開始設定</button>'+
  '<button class="press btn" data-act="backup" style="margin-top:8px;background:#fff;color:'+C.text+';border:1px solid '+C.line+'">我有備份,直接還原</button>'+
  '<div class="foot">請用 Safari 開,然後「加入主畫面」,之後固定從主畫面圖示進來。<br>從主畫面開和從 Safari 開,資料是分開存的。</div></div>';
}
function todayHTML(){
 var s=db.settings, n=new Date();
 if(!s.configured)return welcomeHTML();
 var cyc=curCycle(), r=cycleRange(cyc);
 var disposable=disposableMonthly();
 var inst=activeInstall(cyc), nextInst=activeInstall(nextMonth(cyc));
 var monthExp=cycleExpenses(cyc);
 var spent=monthExp.reduce(function(a,e){return a+e.amount;},0);
 var pool=disposable-inst, remain=pool-spent;
 var dim=r.days;
 n.setHours(0,0,0,0);
 var daysLeft=Math.max(1,Math.round((r.end-n)/86400000)+1);
 var pct=pool>0?Math.min(100,Math.max(0,spent/pool*100)):100;
 var tripLogged=monthExp.some(function(e){return e.cat==="遊";});
 var reserve=(db.play&&!tripLogged)?s.domesticReserve:0;
 var todayCan=Math.max(0,(remain-reserve)/daysLeft);
 var baseline=pool/dim;
 var over=remain<0, hero=over?C.clay:C.ink;
 var msg=over?"這個週期已超支,先踩煞車":todayCan<baseline*0.92?"最近花得比較兇,今天收斂一點":todayCan>baseline*1.08?"你超前進度了,可以鬆一口氣":"原本每天約 "+nt(baseline)+",目前剛好";
 var banner="";
 if(inst>0) banner=bannerHTML(C.gold,"這個週期揹分期 "+nt(inst)+",日常壓到約 "+nt(pool)+"(一天約 "+nt(baseline)+")。");
 else if(nextInst>0) banner=bannerHTML(C.jade,"這個週期是常態、額度較鬆(一天約 "+nt(baseline)+")。下個週期起分期會壓上來,先別太放鬆。");
 var quick=Object.keys(CATS).map(function(k){return '<button class="qbtn press" data-act="add" data-cat="'+k+'">'+ic(ICON[k],CATS[k].color,22)+'<span style="font-size:12px;font-weight:600">'+CATS[k].label+'</span></button>';}).join("");
 var list="";
 if(monthExp.length){
   list='<div class="lbl">這個週期的記錄('+monthExp.length+')</div><div class="card" style="overflow:hidden">'+
     monthExp.slice(0,8).map(function(e){return rowHTML(e,true);}).join("")+
     (monthExp.length>8?'<div style="padding:10px;text-align:center;font-size:12px;color:'+C.faint+'">⋯ 其餘 '+(monthExp.length-8)+' 筆請看月曆頁</div>':'')+'</div>';
 }
 return '<div class="fadein">'+
  '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+headerHTML("看得到的,才花得安心")+
    '<button class="press" data-act="setup" style="padding:4px 2px">'+ic(ICON.gear,C.muted,20)+'</button></div>'+
  '<div class="hero" style="background:'+hero+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:13px;opacity:.8">還能花</span><span style="font-size:12px;opacity:.75">'+cycleLabel(cyc)+'</span></div>'+
    '<div class="big tnum">'+nt(remain)+'</div>'+
    '<div style="display:flex;align-items:baseline;gap:8px;margin-top:10px"><span class="tnum" style="font-size:22px;font-weight:700">'+nt(todayCan)+'</span><span style="font-size:12px;opacity:.85">今天可花 · 剩 '+daysLeft+' 天</span></div>'+
    '<div style="font-size:12px;margin-top:6px;opacity:.9">'+msg+'</div>'+
    '<div style="margin-top:14px;height:6px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:rgba(255,255,255,.9);border-radius:4px"></div></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:11px;opacity:.8;margin-top:6px"><span>已花 '+nt(spent)+'</span><span>週期額度 '+nt(pool)+'</span></div>'+
  '</div>'+banner+
  '<button class="press" data-act="play" style="width:100%;margin-top:10px;text-align:left;background:'+C.surface+';border:1px solid '+C.line+';border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between">'+
    '<div><div style="font-size:14px;font-weight:600">這個月有安排國內旅遊</div><div style="font-size:12px;color:'+C.muted+';margin-top:2px">'+(db.play?(tripLogged?"已記錄,預留解除":"已預留 "+nt(s.domesticReserve)):"沒有的話額度全拿來吃")+'</div></div>'+
    toggleHTML(db.play)+'</button>'+
  '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px">'+quick+'</div>'+
  list+
  '<div class="foot">一週打開一次、記大筆的就好,不用逐筆。</div></div>';
}
function bannerHTML(color,text){return '<div style="background:#F3EEE2;border:1px solid '+C.line+';border-radius:14px;padding:10px 12px;margin-top:10px;font-size:12px;color:'+color+';display:flex;gap:8px">'+ic(ICON.warn,color,16)+'<span>'+esc(text)+'</span></div>';}
/* editable=true 時整列可點開編輯,右邊給刪除鈕 */
function rowHTML(e,editable){var c=CATS[e.cat];
 var tag=e.pay==="card"?'<span style="font-size:11px;color:'+cardColor(e.card)+';margin-left:6px">'+esc(e.card||"")+'</span>':e.pay==="cash"?'<span style="font-size:11px;color:'+C.faint+';margin-left:6px">現金</span>':'';
 return '<div class="row'+(editable?' press" data-act="edit" data-id="'+e.id+'"':'"')+'>'+ic(ICON[e.cat],c.color,18)+
  '<div style="flex:1"><div style="font-size:14px;font-weight:600">'+c.label+(e.note?" · "+esc(e.note):"")+tag+'</div><div style="font-size:11px;color:'+C.faint+'">'+esc(e.date.slice(5))+'</div></div>'+
  '<div class="tnum" style="font-size:15px;font-weight:700">'+nt(e.amount)+'</div>'+
  (editable?'<button class="press" data-act="del" data-id="'+e.id+'" style="padding:6px 4px">'+ic(ICON.trash,C.faint,16)+'</button>':'')+'</div>';
}

/* ---------- CALENDAR ---------- */
function calHTML(){
 var cyc=ui.calCyc||curCycle(), r=cycleRange(cyc), s=cycleStartDay();
 var byDate={}, cycTotal=0;
 cycleExpenses(cyc).forEach(function(e){byDate[e.date]=(byDate[e.date]||0)+e.amount;cycTotal+=e.amount;});
 var todayStr=dstr(new Date());

 /* 週期可能跨兩個日曆月(例:8/25–9/24),所以格子是從週期第一天連續排到最後一天 */
 var days=[];
 for(var d=new Date(r.start);d<=r.end;d.setDate(d.getDate()+1))days.push(new Date(d));
 var cells="";
 for(var i=0;i<days.length;i++){
   if(i===0)for(var b=0;b<days[0].getDay();b++)cells+='<div></div>';
   var dt=days[i], key=dstr(dt), amt=byDate[key]||0;
   var isToday=key===todayStr, on=ui.calSel===key, firstOfMonth=dt.getDate()===1;
   var bg=on?C.ink:amt>0?"#EAE7DC":"transparent";
   cells+='<button class="press" data-act="calDay" data-d="'+key+'" style="aspect-ratio:1;border-radius:10px;border:'+(isToday?"1.5px solid "+C.ink:"1px solid transparent")+';background:'+bg+';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0">'+
     '<span style="font-size:'+(firstOfMonth?11:13)+'px;font-weight:'+(isToday||firstOfMonth?700:500)+';color:'+(on?"#fff":firstOfMonth?C.jade:C.text)+'">'+(firstOfMonth?(dt.getMonth()+1)+"/1":dt.getDate())+'</span>'+
     (amt>0?'<span class="tnum" style="font-size:9px;color:'+(on?"#cfe0d8":C.gold)+'">'+(amt>=1000?Math.round(amt/1000)+"k":amt)+'</span>':'')+'</button>';
 }

 var weeks=[],wk=null;
 days.forEach(function(dt,i){
   if(dt.getDay()===0||i===0){if(wk)weeks.push(wk);wk={start:dt,end:dt,total:0};}
   wk.end=dt;wk.total+=(byDate[dstr(dt)]||0);
 });
 if(wk)weeks.push(wk);
 var md=function(dt){return (dt.getMonth()+1)+"/"+dt.getDate();};
 var weeksHTML=weeks.map(function(w,i){return '<div class="row"><div style="flex:1"><div style="font-size:14px;font-weight:600">第 '+(i+1)+' 週</div><div style="font-size:11px;color:'+C.faint+'">'+md(w.start)+' – '+md(w.end)+'</div></div><div class="tnum" style="font-size:16px;font-weight:700;color:'+(w.total>0?C.text:C.faint)+'">'+nt(w.total)+'</div></div>';}).join("");

 var selHTML="";
 if(ui.calSel){
   var sl=db.expenses.filter(function(e){return e.date===ui.calSel;});
   var selDate=ui.calSel.slice(5).replace("-","/");
   selHTML='<div class="lbl">'+selDate+' 的明細'+(sl.length?'(點一筆可編輯)':'')+'</div>'+
     '<div class="card" style="'+(sl.length?"":"padding:16px;")+'overflow:hidden">'+
     (sl.length?sl.map(function(e){return rowHTML(e,true);}).join(""):'<div style="font-size:13px;color:'+C.muted+';text-align:center">這天沒有記錄</div>')+'</div>';
 }
 return '<div class="fadein">'+headerHTML(s>1?"以薪水週期為一個月 · 不是日曆月":"整個月一眼看完 · 哪天花了、哪天空白")+
  '<div class="card" style="padding:16px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
      '<button class="press" data-act="calShift" data-n="-1" style="color:'+C.muted+';font-size:20px;padding:2px 10px">‹</button>'+
      '<div style="text-align:center"><div style="font-size:16px;font-weight:700">'+cycleLabel(cyc)+'</div><div style="font-size:12px;color:'+C.gold+';margin-top:2px">這個週期已花 '+nt(cycTotal)+'</div></div>'+
      '<button class="press" data-act="calShift" data-n="1" style="color:'+C.muted+';font-size:20px;padding:2px 10px">›</button></div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11px;color:'+C.faint+';margin-bottom:6px"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">'+cells+'</div>'+
  '</div>'+selHTML+
  '<div class="lbl">每週小計(補記在哪天都算對)</div><div class="card" style="overflow:hidden">'+weeksHTML+'</div>'+
  '<div class="foot">點日期看當天明細,點明細可以改,右邊垃圾桶可以刪。</div></div>';
}

/* ---------- 股息行事曆 ---------- */
function divCardHTML(stockCost){
 var list=nextDividends(12);
 var total=list.reduce(function(a,d){return a+d.amount;},0);
 var head='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:'+(list.length?"12px":"0")+'">'+
   '<div style="font-size:14px;font-weight:700">股息行事曆 · 未來 12 個月</div>'+
   '<button class="press" data-act="setup" style="font-size:12px;color:'+C.jade+';font-weight:600;padding:2px 0">編輯</button></div>';
 if(!list.length){
   return '<div class="card" style="padding:16px;margin-top:12px">'+head+
     '<div style="font-size:13px;color:'+C.muted+';line-height:1.6;margin-top:8px">還沒登記股息。到設定裡把每檔股票的<b>入帳月份</b>和<b>金額</b>填進來,這裡就會列出未來一年什麼時候有錢進來,時間軸也會一起算。</div></div>';
 }
 var byYm={};
 list.forEach(function(d){(byYm[d.ym]=byYm[d.ym]||[]).push(d);});
 var rows=Object.keys(byYm).sort().map(function(ym,i){
   var items=byYm[ym], sum=items.reduce(function(a,d){return a+d.amount;},0);
   return '<div style="padding:10px 0;border-top:'+(i===0?"none":"1px solid "+C.line)+'">'+
     '<div style="display:flex;justify-content:space-between;align-items:baseline">'+
       '<span style="font-size:14px;font-weight:700">'+(+ym.split("-")[1])+' 月</span>'+
       '<span class="tnum" style="font-size:16px;font-weight:700;color:'+C.jade+'">+'+nt(sum)+'</span></div>'+
     items.map(function(d){return '<div style="display:flex;justify-content:space-between;font-size:12px;color:'+C.muted+';margin-top:3px"><span>'+esc(d.name)+(d.yearly?' <span style="color:'+C.faint+'">每年</span>':'')+'</span><span class="tnum">'+nt(d.amount)+'</span></div>';}).join("")+
     '</div>';
 }).join("");
 var yieldPct=stockCost>0?(total/stockCost*100):null;
 return '<div class="card" style="padding:16px;margin-top:12px">'+head+
   '<div style="background:#E4EEE9;border-radius:12px;padding:12px 14px;margin-bottom:6px">'+
     '<div style="font-size:12px;color:'+C.jade+'">未來 12 個月預計領到</div>'+
     '<div class="tnum" style="font-size:28px;font-weight:700;color:'+C.jade+';letter-spacing:-.02em">'+nt(total)+'</div>'+
     (yieldPct!==null?'<div style="font-size:12px;color:'+C.muted+';margin-top:2px">以投入成本 '+nt(stockCost)+' 計,現金殖利率約 '+yieldPct.toFixed(1)+'%</div>':'')+
     '<div style="font-size:12px;color:'+C.muted+';margin-top:2px">平均一個月多 '+nt(total/12)+'</div></div>'+
   rows+'</div>';
}

 var a=db.assets, st=stockTotals(), stockValue=st.value, stockCost=st.cost;
 var principal=a.savingsAccum+stockCost+a.travelFund+a.cash;
 var total=a.savingsAccum+stockValue+a.travelFund+a.cash;

 var mp=db.settings.savingsFixed+db.settings.invest;
 var buckets=[{l:"存錢累積",v:a.savingsAccum,c:C.ink},{l:"股票",v:stockValue,c:C.blue},{l:"出國基金",v:a.travelFund,c:C.gold},{l:"現金",v:a.cash,c:C.jade}];
 var ch=ui.checks||{};

 var barSeg=total>0?buckets.map(function(b){return '<div style="width:'+share(b.v)+'%;background:'+b.c+'"></div>';}).join(""):'<div style="width:100%;background:'+C.lockbg+'"></div>';
 var bkRows=buckets.map(function(b,i){return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:'+(i===0?"none":"1px solid "+C.line)+'"><div style="width:10px;height:10px;border-radius:3px;background:'+b.c+'"></div><span style="flex:1;font-size:14px">'+b.l+'</span><span style="font-size:12px;color:'+C.faint+'">'+Math.round(share(b.v))+'%</span><span class="tnum" style="font-size:15px;font-weight:700;min-width:84px;text-align:right">'+nt(b.v)+'</span></div>';}).join("");
 var checkRows=[["save","定存 "+nt(db.settings.savingsFixed)],["invest","定期定額 "+nt(db.settings.invest)+"(可補實際買進)"],["fund","出國基金 "+nt(db.settings.travelFundMonthly)]].map(function(x){var on=ch[x[0]];
   return '<button class="press" data-act="chk" data-k="'+x[0]+'" style="width:100%;display:flex;align-items:center;gap:12px;padding:12px 10px;text-align:left">'+
     '<div style="width:24px;height:24px;border-radius:8px;flex-shrink:0;background:'+(on?C.jade:"#fff")+';border:1.5px solid '+(on?C.jade:C.line)+';display:flex;align-items:center;justify-content:center">'+(on?ic(ICON.check,"#fff",16):"")+'</div>'+
     '<span style="font-size:14px;color:'+(on?C.faint:C.text)+';text-decoration:'+(on?"line-through":"none")+'">'+x[1]+'</span></button>';}).join("");
 var goalsHTML=(db.goals||[]).map(goalCardHTML.bind(null,total,mp)).join("");
 return '<div class="fadein">'+
  '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+headerHTML("別只看花掉多少,看你存了多少")+'<button class="press" data-act="lock" style="color:'+C.muted+';font-size:12px;padding:6px">🔒 鎖上</button></div>'+
  (a.example?'<div style="background:#F3EEE2;border:1px solid '+C.line+';border-radius:12px;padding:8px 12px;font-size:12px;color:'+C.gold+';margin-bottom:12px">資產數字還沒填。點下方「校正起點」輸入你的股票、存款現值,曲線才會準。</div>':'')+
  '<div class="hero" style="background:'+C.ink+'"><div style="font-size:13px;opacity:.8">總資產</div><div class="tnum" style="font-size:44px;font-weight:700;letter-spacing:-.03em">'+nt(total)+'</div>'+
    '<div style="display:flex;gap:14px;margin-top:8px;font-size:12px"><span style="opacity:.85">本金投入 '+nt(principal)+'</span><span style="color:'+(pnl>=0?"#9FE0C4":"#F0B49A")+'">股票'+(pnl>=0?"未實現獲利 +":"帳面回落 ")+nt(pnl)+'</span></div>'+
    '<div style="margin-top:10px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border-radius:20px;padding:4px 10px;font-size:12px">✨ 每個月本金自動 +'+nt(mp)+(mp>0?' · 一年 +'+nt(mp*12):"")+'</div></div>'+
  netWorthHistoryHTML()+
  '<div class="lbl">目標 Goal · 含預估達成時間</div>'+goalsHTML+
  '<button class="press" data-act="goalEdit" style="width:100%;margin-top:2px;background:#fff;color:'+C.text+';border:1px solid '+C.line+';border-radius:14px;padding:12px 0;font-size:14px;font-weight:600">編輯目標與任務</button>'+
  '<div class="lbl">各桶佔比</div><div class="card" style="padding:16px"><div style="display:flex;height:12px;border-radius:6px;overflow:hidden;margin-bottom:14px">'+barSeg+'</div>'+bkRows+'</div>'+
  '<button class="press" data-act="assetsView" data-v="holdings" style="width:100%;margin-top:10px;background:'+C.surface+';border:1px solid '+C.line+';border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;text-align:left">'+
    '<div><div style="font-size:14px;font-weight:600">股票持股 · 配置分析 · 股息</div><div style="font-size:12px;color:'+C.muted+';margin-top:2px">'+((db.holdings||[]).length?"共 "+db.holdings.length+" 檔":"想深入看再點進去")+'</div></div>'+
    '<span style="color:'+C.faint+';font-size:18px">›</span></button>'+
  '<div class="lbl">本月固定存錢 · 打勾確認真的有做</div><div class="card" style="padding:8px">'+checkRows+
    (all?'<div style="margin:8px;padding:10px 12px;background:#E4EEE9;border-radius:12px;font-size:13px;color:'+C.jade+';font-weight:600;text-align:center">本月 +'+nt(mp)+' 本金已確認 · 資產又疊高一層 💪</div>':'')+'</div>'+
  '<button class="press" data-act="assetEdit" style="width:100%;margin-top:12px;background:#fff;color:'+C.text+';border:1px solid '+C.line+';border-radius:14px;padding:14px 0;font-size:15px;font-weight:600">校正起點(股票、存款現值)</button>'+
  '<button class="press" data-act="pwReset" style="width:100%;margin-top:8px;color:'+C.faint+';font-size:12px;padding:8px 0">忘記密碼?清空資產資料重設</button>'+
  '<div class="foot">資產一個月看一次就好,股票市值月底更新,或問 Claude 幫你查。</div></div>';
}

 return '<div class="fadein">'+

/* 每月固定投入 mp,推算還要幾個月才會到 target */
function etaMonths(need,mp){return mp>0?Math.max(0,Math.ceil(need/mp)):null;}
function etaText(need,mp){
 var m=etaMonths(need,mp);
 if(m===null)return "先設定每月定存/定期定額";
 if(m===0)return "就快到了";
 var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+m);
 return d.getFullYear()+"/"+pad2(d.getMonth()+1)+" · 約 "+m+" 個月";
}
function goalCardHTML(total,mp,g){
 var pct=g.target>0?Math.min(100,total/g.target*100):0;
 var nx=g.tasks.filter(function(t){return total<t.target;})[0];
 var tasks=g.tasks.map(function(t){var done=total>=t.target;var isNext=nx&&t.id===nx.id;
   return '<div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:'+(isNext?"7px 8px":"3px 8px")+';border-radius:8px;background:'+(isNext?"#EAE7DC":"transparent")+'">'+

 document.querySelectorAll("[data-sec][data-f]").forEach(function(el){
   var o=d[el.getAttribute("data-sec")][+el.getAttribute("data-i")];if(!o)return;
   var f=el.getAttribute("data-f");
   o[f]=(f==="name"||f==="card"||f==="startYM"||f==="ym")?el.value:numv(el.value);
 });
}
function numv(v){var n=Number(String(v).replace(/[^0-9.\-]/g,""));return isFinite(n)?Math.round(n):0;}
function applySetup(){
 syncSetup();var sd=ui.setupDraft;
 sd.cards.forEach(function(c,i){if(!c.color)c.color=CARD_COLORS[i%CARD_COLORS.length];});
 db.settings=Object.assign({},db.settings,sd.settings);
 var csd=Math.round(Number(db.settings.cycleStartDay))||1;
 db.settings.cycleStartDay=csd<1?1:(csd>28?28:csd); /* 29–31 號有些月份不存在,夾到 28 */
 db.settings.configured=db.settings.income>0;
 db.cards=sd.cards;db.installments=sd.installments;db.plans=sd.plans;db.dividends=sd.dividends;
 ui.calCyc=curCycle();ui.calSel=null;
 persist();
}

/* ---------- 備份與還原 ---------- */
function backupHTML(){
 var json=backupJSON();
 var ta='width:100%;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 12px;border-radius:12px;border:1px solid '+C.line+';outline:none;background:'+C.surface+';resize:vertical;line-height:1.4';
 var stat=[["記錄",db.expenses.length+" 筆"],["信用卡",db.cards.length+" 張"],["分期",db.installments.length+" 筆"],["大筆規劃",db.plans.length+" 筆"],["股息",db.dividends.length+" 筆"],["持股",db.holdings.length+" 檔"]];
 var statRows=stat.map(function(x,i){return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-top:'+(i===0?"none":"1px solid "+C.line)+';font-size:13px"><span style="color:'+C.muted+'">'+x[0]+'</span><span style="font-weight:600">'+x[1]+'</span></div>';}).join("");
 return sheetHead("備份與還原")+
  '<div style="font-size:12px;color:'+C.muted+';line-height:1.6;background:#F3EEE2;border-radius:12px;padding:10px 12px">你的資料只存在這台裝置,沒有雲端可以幫你留一份。換手機、清掉 Safari 資料、或太久沒打開,都可能整組消失。定期匯出一份存到「檔案」或雲碟,就永遠救得回來。</div>'+

  '<div class="lbl">匯出</div>'+
  '<div class="card" style="padding:12px 14px">'+statRows+'</div>'+
  '<button class="press btn" data-act="bkShare" style="margin-top:10px;background:'+C.ink+';color:#fff">分享 / 存到檔案</button>'+
  '<button class="press btn" data-act="bkCopy" style="margin-top:8px;background:#fff;color:'+C.text+';border:1px solid '+C.line+'">複製成文字</button>'+
  '<div id="bkMsg" style="font-size:12px;color:'+C.jade+';text-align:center;min-height:18px;margin-top:8px"></div>'+
  '<details style="margin-top:2px"><summary style="font-size:12px;color:'+C.muted+';padding:6px 0">看/手動複製備份內容</summary>'+
    '<textarea id="bkText" readonly rows="6" style="'+ta+';margin-top:6px">'+esc(json)+'</textarea></details>'+

  '<div class="lbl">還原</div>'+
  '<div style="font-size:12px;color:'+C.clay+';line-height:1.6;margin-bottom:10px">還原會用備份的內容<b>整組覆蓋</b>現在的資料,現在的會不見。密碼不含在備份裡,還原後重設一組即可。</div>'+
  '<div style="font-size:12px;color:'+C.muted+';margin-bottom:6px">選一個備份檔</div>'+
  '<input type="file" id="impFile" accept=".json,application/json,text/plain" style="width:100%;font-size:13px;margin-bottom:12px"/>'+
  '<div style="font-size:12px;color:'+C.muted+';margin-bottom:6px">或把備份文字貼在這裡</div>'+
  '<textarea id="impText" rows="4" placeholder="{&quot;app&quot;:&quot;money-tracker&quot;, ...}" style="'+ta+'">'+esc(ui.impText||"")+'</textarea>'+
  '<div id="impMsg" style="font-size:12px;color:'+C.clay+';text-align:center;min-height:18px;margin-top:8px"></div>'+
  '<button class="press btn" data-act="bkImport" style="margin-top:4px;background:'+C.clay+';color:#fff">覆蓋現在的資料</button>';
}
function bkNote(id,text,color){var e=document.getElementById(id);if(e){e.textContent=text;e.style.color=color;}}

function pwResetHTML(){
 return sheetHead("重設密碼")+
  '<div style="font-size:13px;margin-bottom:16px;line-height:1.6">因為資料只存在你手機本機、沒有雲端,沒辦法「找回」密碼。唯一的重設方式是清空資產頁的數字、移除密碼,再重設。日常、月曆、時間軸的資料不受影響。</div>'+
  '<button class="press btn" data-act="doPwReset" style="background:'+C.clay+';color:#fff">清空資產並移除密碼</button>'+
  '<button class="press" data-act="close" style="width:100%;margin-top:8px;color:'+C.muted+';font-size:13px;padding:8px 0">取消</button>';

/* ---------- render ---------- */
function render(){
 var main="";
 if(ui.tab==="today")main=todayHTML();
 else if(ui.tab==="cal")main=calHTML();
 else if(ui.tab==="assets")main=assetsHTML();
 else if(ui.tab==="flow")main=flowHTML();
 var store=ui.noStore?'<div style="max-width:460px;margin:0 auto;padding:0 14px;font-size:12px;color:'+C.clay+';text-align:center;line-height:1.5">這個環境不能存檔,重整會清空。請下載到手機、用瀏覽器開就正常。</div>':'';
 var old=document.querySelector(".sheet"), keep=old?old.scrollTop:0;
 document.getElementById("root").innerHTML='<div class="wrap">'+main+store+'</div>'+navHTML()+sheetHTML();
 var sh=document.querySelector(".sheet");if(sh&&keep)sh.scrollTop=keep;
 var amt=document.getElementById("amt");if(amt){amt.focus();}
}

/* ---------- sync helpers ---------- */
function syncAddForm(){var a=document.getElementById("amt");if(a)ui.addForm.amt=a.value.replace(/[^0-9]/g,"");var n=document.getElementById("note");if(n)ui.addForm.note=n.value;var d=document.getElementById("date");if(d)ui.addForm.date=d.value;}
function syncGoalDraft(){document.querySelectorAll("[data-gd]").forEach(function(el){var gi=+el.getAttribute("data-gd");var f=el.getAttribute("data-f");var ti=el.getAttribute("data-td");
  if(ti===null){if(f==="name")ui.goalDraft[gi].name=el.value;else ui.goalDraft[gi].target=+(el.value.replace(/[^0-9]/g,""))||0;}
  else{var t=ui.goalDraft[gi].tasks[+ti];if(f==="name")t.name=el.value;else t.target=+(el.value.replace(/[^0-9]/g,""))||0;}});}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
 var el=ev.target.closest("[data-act]");
 if(!el){return;}
 var act=el.getAttribute("data-act");
 if(act==="closeBg"){ if(ev.target.closest("[data-stop]"))return; ui.sheet=null;render();return; }
 if(act==="close"){ui.sheet=null;render();return;}
 if(act==="tab"){var tb=el.getAttribute("data-tab");if(tb==="assets"){ui.assetsView="overview";if(!ui.unlocked){ui.sheet={type:"lock"};render();return;}}ui.tab=tb;render();return;}
 if(act==="assetsView"){ui.assetsView=el.getAttribute("data-v");render();return;}
 if(act==="play"){db.play=!db.play;persist();render();return;}
 if(act==="add"){ui.addForm={cat:el.getAttribute("data-cat"),amt:"",note:"",pay:db.cards.length?"card":"cash",card:db.cards.length?db.cards[0].name:null,date:new Date().toISOString().slice(0,10)};ui.sheet={type:"add"};render();return;}
 if(act==="qamt"){var i=document.getElementById("amt");if(i){i.value=el.getAttribute("data-q");ui.addForm.amt=el.getAttribute("data-q");i.focus();}return;}
 if(act==="setpay"){syncAddForm();ui.addForm.pay=el.getAttribute("data-v");render();return;}
 if(act==="setcard"){syncAddForm();ui.addForm.card=el.getAttribute("data-v");render();return;}
 if(act==="setcat"){syncAddForm();ui.addForm.cat=el.getAttribute("data-v");render();return;}
 if(act==="edit"){var eid=+el.getAttribute("data-id");var ex=db.expenses.filter(function(e){return e.id===eid;})[0];if(!ex)return;
   ui.addForm={id:ex.id,cat:ex.cat,amt:String(ex.amount),note:ex.note||"",pay:ex.pay||"card",card:ex.card||(db.cards.length?db.cards[0].name:null),date:ex.date};
   ui.sheet={type:"add"};render();return;}
 if(act==="saveAdd"){syncAddForm();var f=ui.addForm;var amt=Math.round(Number(f.amt));if(!amt||amt<=0)return;
   var isCash=f.cat==="現";
   var item={id:f.id||uid(),date:f.date,cat:f.cat,amount:amt,note:f.note,pay:isCash?"cash":f.pay,card:(!isCash&&f.pay==="card")?f.card:null};
   if(f.id){ /* 編輯:先把舊記錄對現金桶的影響抵銷,再套用新的 */
     var i0=-1;db.expenses.forEach(function(e,ix){if(e.id===f.id)i0=ix;});
     if(i0<0)return;
     var old=db.expenses[i0];
     if(old.cat==="現")db.assets.cash-=old.amount;
     if(isCash)db.assets.cash+=amt;
     db.expenses[i0]=item;
   }else{
     db.expenses.unshift(item);
     if(isCash)db.assets.cash+=amt;
   }
   persist();ui.sheet=null;render();return;}
 if(act==="del"){var id=+el.getAttribute("data-id");
   var gone=db.expenses.filter(function(e){return e.id===id;})[0];
   if(gone&&gone.cat==="現")db.assets.cash=Math.max(0,db.assets.cash-gone.amount); /* 領現金被刪掉,現金桶同步扣回 */
   db.expenses=db.expenses.filter(function(e){return e.id!==id;});
   persist();ui.sheet=null;render();return;}
 if(act==="calShift"){ui.calCyc=shiftCycle(ui.calCyc||curCycle(),+el.getAttribute("data-n"));ui.calSel=null;render();return;}
 if(act==="calDay"){var dd=el.getAttribute("data-d");ui.calSel=(ui.calSel===dd?null:dd);render();return;}
 if(act==="lock"){ui.unlocked=false;ui.tab="today";ui.assetsView="overview";render();return;}
 if(act==="chk"){ui.checks=ui.checks||{};var k=el.getAttribute("data-k");ui.checks[k]=!ui.checks[k];render();return;}
 if(act==="assetEdit"){ui.sheet={type:"assetEdit"};render();return;}
 if(act==="saveAsset"){["savingsAccum","stockCost","stockValue","travelFund","cash"].forEach(function(k){var e=document.getElementById("ae_"+k);if(e)db.assets[k]=Number(e.value.replace(/[^0-9]/g,""))||0;});db.assets.example=false;snapshotNetWorth();persist();ui.sheet=null;render();return;}
 if(act==="holdingsEdit"){ui.holdingsDraft=JSON.parse(JSON.stringify(db.holdings||[]));ui.sheet={type:"holdings"};render();return;}
 if(act==="addHolding"){syncHoldingsDraft();ui.holdingsDraft.push({id:uid(),name:"新持股",type:HOLDING_TYPES[0],shares:0,avgCost:0,price:0});render();return;}
 if(act==="delHolding"){syncHoldingsDraft();ui.holdingsDraft.splice(+el.getAttribute("data-i"),1);render();return;}
 if(act==="saveHoldings"){syncHoldingsDraft();db.holdings=ui.holdingsDraft;db.assets.example=false;snapshotNetWorth();persist();ui.sheet=null;render();return;}
 if(act==="pwReset"){ui.sheet={type:"pwReset"};render();return;}
 if(act==="doPwReset"){db.assets=JSON.parse(JSON.stringify(DEFAULTS.assets));localStorage.removeItem(PWKEY);persist();ui.unlocked=false;ui.sheet=null;ui.tab="today";render();return;}
 if(act==="lockSubmit"){var mode=el.getAttribute("data-mode");var pw=(document.getElementById("pw")||{}).value||"";var errEl=document.getElementById("pwerr");
   if(mode==="set"){var pw2=(document.getElementById("pw2")||{}).value||"";if(pw.length<4){errEl.textContent="至少 4 碼";return;}if(pw!==pw2){errEl.textContent="兩次輸入不一致";return;}localStorage.setItem(PWKEY,pw);ui.unlocked=true;ui.sheet=null;ui.tab="assets";render();}
   else{if(pw===localStorage.getItem(PWKEY)){ui.unlocked=true;ui.sheet=null;ui.tab="assets";render();}else{errEl.textContent="密碼不對";}}
   return;}
 if(act==="setup"){ui.setupDraft={settings:Object.assign({},db.settings),cards:JSON.parse(JSON.stringify(db.cards)),installments:JSON.parse(JSON.stringify(db.installments)),plans:JSON.parse(JSON.stringify(db.plans)),dividends:JSON.parse(JSON.stringify(db.dividends))};ui.sheet={type:"setup"};render();return;}
 if(act==="addRow"){syncSetup();var sec=el.getAttribute("data-sec"),d=ui.setupDraft,cur=curCycle();
   if(sec==="cards")d.cards.push({id:uid(),name:"新卡片",color:CARD_COLORS[d.cards.length%CARD_COLORS.length],closeDay:1,payDay:15});
   else if(sec==="installments")d.installments.push({id:uid(),name:"新分期",amt:0,startYM:cur,count:6,card:d.cards.length?d.cards[0].name:""});
   else if(sec==="dividends")d.dividends.push({id:uid(),name:"新股息",ym:cur,amount:0,yearly:true});
   else d.plans.push({id:uid(),ym:cur,name:"新項目",amount:0,card:""});
   render();return;}
 if(act==="divYearly"){syncSetup();var dv=ui.setupDraft.dividends[+el.getAttribute("data-i")];if(dv)dv.yearly=!dv.yearly;render();return;}
 if(act==="delRow"){syncSetup();ui.setupDraft[el.getAttribute("data-sec")].splice(+el.getAttribute("data-i"),1);render();return;}
 if(act==="saveSetup"){applySetup();ui.sheet=null;render();return;}
 if(act==="backup"){
   if(ui.sheet&&ui.sheet.type==="setup")applySetup(); /* 從設定進來,先把剛改的存起來再備份 */
   ui.impText="";ui.sheet={type:"backup"};render();return;}
 if(act==="bkShare"){
   var json=backupJSON(), name=backupName();
   /* iOS 主畫面模式下「下載」常常無效,分享面板才是最可靠的出口 */
   try{
     var file=new File([json],name,{type:"application/json"});
     if(navigator.canShare&&navigator.canShare({files:[file]})){
       navigator.share({files:[file],title:"Money Tracker 備份"}).then(function(){bkNote("bkMsg","已送出,記得選「儲存到檔案」",C.jade);},function(){});
       return;
     }
     if(navigator.share){
       navigator.share({title:name,text:json}).then(function(){bkNote("bkMsg","已送出",C.jade);},function(){});
       return;
     }
   }catch(e){}
   try{ /* 桌面瀏覽器就直接下載 */
     var a=document.createElement("a");
     a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
     a.download=name;a.click();
     setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
     bkNote("bkMsg","已下載 "+name,C.jade);
   }catch(e2){bkNote("bkMsg","這台裝置不支援分享,請改用下面的「複製成文字」",C.clay);}
   return;}
 if(act==="bkCopy"){
   var txt=backupJSON();
   var done=function(){bkNote("bkMsg","已複製,貼到備忘錄或傳給自己就是一份備份",C.jade);};
   if(navigator.clipboard&&navigator.clipboard.writeText){
     navigator.clipboard.writeText(txt).then(done,function(){bkNote("bkMsg","複製失敗,請展開下面的備份內容手動長按複製",C.clay);});
   }else{
     var t=document.getElementById("bkText");
     if(t){t.closest("details").open=true;t.focus();t.select();
       try{document.execCommand("copy");done();}catch(e){bkNote("bkMsg","請長按上面的文字手動複製",C.clay);}}
   }
   return;}
 if(act==="bkImport"){
   var raw=(document.getElementById("impText")||{}).value||"";
   if(!raw.trim()){bkNote("impMsg","請先選檔案或貼上備份文字",C.clay);return;}
   var incoming;
   try{incoming=parseBackup(raw);}catch(err){bkNote("impMsg",(err&&err.message)||"備份內容讀不出來",C.clay);return;}
   var sum=incoming.expenses.length+" 筆記錄、"+incoming.cards.length+" 張卡、"+incoming.installments.length+" 筆分期";
   if(!window.confirm("要用這份備份覆蓋現在的資料嗎?\n\n備份內容:"+sum+"\n\n現在的資料會被取代,無法復原。"))return;
   db=incoming;persist();
   ui.impText="";ui.sheet=null;ui.tab="today";ui.calCyc=curCycle();ui.calSel=null;ui.unlocked=false;
   render();return;}
 if(act==="goalEdit"){ui.goalDraft=JSON.parse(JSON.stringify(db.goals||[]));ui.sheet={type:"goalEdit"};render();return;}
 if(act==="addGoal"){syncGoalDraft();ui.goalDraft.push({id:uid(),name:"新目標",target:500000,tasks:[]});render();return;}
 if(act==="delGoal"){syncGoalDraft();ui.goalDraft.splice(+el.getAttribute("data-i"),1);render();return;}
 if(act==="addTask"){syncGoalDraft();ui.goalDraft[+el.getAttribute("data-i")].tasks.push({id:uid(),name:"新任務",target:100000});render();return;}
 if(act==="delTask"){syncGoalDraft();ui.goalDraft[+el.getAttribute("data-i")].tasks.splice(+el.getAttribute("data-j"),1);render();return;}
 if(act==="saveGoal"){syncGoalDraft();db.goals=ui.goalDraft;persist();ui.sheet=null;render();return;}
});

/* 選了備份檔就把內容讀進下面的文字框,按鈕統一走 bkImport */
document.addEventListener("change",function(ev){
 var el=ev.target;
 if(!el||el.id!=="impFile"||!el.files||!el.files[0])return;
 var fr=new FileReader();
 fr.onload=function(){
   var box=document.getElementById("impText");
   if(box){box.value=String(fr.result||"");ui.impText=box.value;}
   try{parseBackup(String(fr.result||""));bkNote("impMsg","讀到備份了,按下面的按鈕還原",C.jade);}
   catch(e){bkNote("impMsg",(e&&e.message)||"這個檔案讀不出來",C.clay);}
 };
 fr.onerror=function(){bkNote("impMsg","檔案讀取失敗,可以改用貼上文字的方式",C.clay);};
 fr.readAsText(el.files[0]);
});

/* ---------- init ---------- */
try{
  db=load();
  ui={tab:"today",sheet:null,unlocked:false,assetsView:"overview",calCyc:curCycle(),calSel:null,checks:{},addForm:null,goalDraft:null,setupDraft:null,holdingsDraft:null,noStore:false};
  try{localStorage.setItem("__t","1");localStorage.removeItem("__t");}catch(e){ui.noStore=true;}
  render();
}catch(err){
  document.getElementById("root").innerHTML='<div style="padding:40px 24px;color:#B0603A;font-size:14px;line-height:1.6">程式載入時出錯:<br>'+String(err&&err.message||err)+'</div>';
}
